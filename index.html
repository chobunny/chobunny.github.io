<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Luigi'nin Havuç Macerası</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to bottom, #0a1430, #1b2a55);
  color:white;
  text-align:center;
}

/* ARKA PLAN SÜZÜLEN EMOJİLER */

.floating{
  position:absolute;
  font-size:30px;
  animation: floatUp linear infinite;
  opacity:0.3;
}

@keyframes floatUp{
  from{ transform:translateY(100vh); }
  to{ transform:translateY(-10vh); }
}

.screen{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  position:relative;
  z-index:2;
}

.active{ display:flex; }

button{
  background:#ffb6d9;
  border:none;
  padding:12px 20px;
  margin:10px;
  border-radius:25px;
  cursor:pointer;
  font-size:16px;
  transition:0.3s;
}

button:hover{
  background:#ffcbe6;
}

.rabbit-img{
  width:220px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(255,182,217,0.6);
}

.grow{
  transition:0.3s;
}
</style>
</head>
<body>

<!-- SÜZÜLEN EMOJİLER -->
<script>
for(let i=0;i<25;i++){
  let el=document.createElement("div");
  el.className="floating";
  el.style.left=Math.random()*100+"vw";
  el.style.animationDuration=(5+Math.random()*10)+"s";
  el.innerText=Math.random()>0.5?"🐰":"🥕";
  document.body.appendChild(el);
}
</script>

<div id="start" class="screen active">
  <h1>Luigi havucunu kaybetti...</h1>
  <button onclick="next('luigi')">Luigi’ye git 🐰</button>
</div>

<div id="luigi" class="screen">
  <img class="rabbit-img" src="https://images.unsplash.com/photo-1585110396000-c9ffd4e4b308?q=80&w=800&auto=format&fit=crop" alt="rabbit">
  <p>Ben Luigi... Havucumu buldum galiba.</p>
  <button onclick="next('search')">Havucu ver 🥕</button>
  <button id="eatBtn" class="grow" onclick="growBtn()">Ben yicem</button>
  <p id="reaction"></p>
</div>

<div id="search" class="screen">
  <h2>Havuç bulundu 🥕</h2>
  <p>Devamı sonra eklenecek...</p>
</div>

<script>

function next(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* BÜYÜYEN BUTON */

let scale=1;
let clicks=0;
let reactions=["yuh","dana","daha ne kadar yicen","ayıp değil mi","YEME BE"];

function growBtn(){
  scale+=0.3;
  document.getElementById("eatBtn").style.transform="scale("+scale+")";
  
  if(clicks < reactions.length){
    document.getElementById("reaction").innerText=reactions[clicks];
    clicks++;
  }
}

</script>

</body>
</html>
