<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Luigi'nin Havuç Macerası</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:'Segoe UI', sans-serif;
  background:linear-gradient(to bottom,#0a1430,#1b2a55);
  color:white;
  text-align:center;
}

/* FLOATING EMOJIS */
.floating{
  position:absolute;
  font-size:28px;
  animation: floatUp linear infinite;
  opacity:0.25;
}

@keyframes floatUp{
  from{ transform:translateY(100vh); }
  to{ transform:translateY(-10vh); }
}

.screen{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  position:relative;
  z-index:2;
  padding:20px;
}

.active{ display:flex; }

button{
  background:#ffb6d9;
  border:none;
  padding:12px 22px;
  margin:10px;
  border-radius:25px;
  cursor:pointer;
  font-size:16px;
  transition:0.3s;
}

button:hover{
  background:#ffcbe6;
}

.rabbit-img{
  width:230px;
  border-radius:20px;
  box-shadow:0 0 25px rgba(255,182,217,0.7);
}

.choice{
  font-size:50px;
  cursor:pointer;
  margin:15px;
  transition:0.3s;
}

.choice:hover{
  transform:scale(1.2);
}

.letter-box{
  background:#ffe6f3;
  color:#0a1430;
  padding:30px;
  border-radius:15px;
  max-width:400px;
  box-shadow:0 0 25px rgba(255,182,217,0.8);
}
</style>
</head>
<body>

<!-- Minecraft Music -->
<audio autoplay loop>
  <source src="minecraft.mp3" type="audio/mpeg">
</audio>

<script>
/* FLOATING ELEMENTS */
for(let i=0;i<35;i++){
  let el=document.createElement("div");
  el.className="floating";
  el.style.left=Math.random()*100+"vw";
  el.style.animationDuration=(6+Math.random()*10)+"s";
  let items=["🐰","🥕","💗"];
  el.innerText=items[Math.floor(Math.random()*items.length)];
  document.body.appendChild(el);
}
</script>

<!-- START -->
<div id="start" class="screen active">
  <h1>Luigi havucunu kaybetti...</h1>
  <button onclick="next('luigi')">Luigi’ye git 🐰</button>
</div>

<!-- LUIGI SCREEN -->
<div id="luigi" class="screen">
  <img class="rabbit-img" src="rabbit1.jpg">
  <p>Ben Luigi... Havucumu buldum galiba.</p>
  <button onclick="next('search')">Havucu ver 🥕</button>
  <button id="eatBtn" onclick="growBtn()">Ben yicem</button>
  <p id="reaction"></p>
</div>

<!-- SEARCH -->
<div id="search" class="screen">
  <h2>Havucu seç 🥕</h2>
  <div>
    <span class="choice" onclick="wrong()">🌟</span>
    <span class="choice" onclick="wrong()">🍄</span>
    <span class="choice" onclick="correct()">🥕</span>
  </div>
</div>

<!-- SAD -->
<div id="sad" class="screen">
  <img class="rabbit-img" src="rabbit_sad.jpg">
  <h2>Artık Luigi'yi üzdün.</h2>
  <button onclick="next('search')">Tekrar dene</button>
</div>

<!-- HAPPY -->
<div id="happy" class="screen">
  <img class="rabbit-img" src="rabbit_happy.jpg">
  <h2>Luigi çok mutlu! 💗</h2>
  <button onclick="next('letter')">Luigi'nin mektubunu aç 💌</button>
</div>

<!-- LETTER -->
<div id="letter" class="screen">
  <img class="rabbit-img" src="rabbit_letter.jpg">
  <div class="letter-box">
    <h2>💌</h2>
    <p>
      BURAYA MEKTUBU YAZACAKSIN.
    </p>
  </div>
</div>

<script>
function next(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* BÜYÜYEN BUTON */
let scale=1;
let clicks=0;
let reactions=["yuh","dana","daha ne kadar yicen","ayıp değil mi","YEME BE"];

function growBtn(){
  scale+=0.3;
  document.getElementById("eatBtn").style.transform="scale("+scale+")";
  
  if(clicks < reactions.length){
    document.getElementById("reaction").innerText=reactions[clicks];
    clicks++;
  }
}

function wrong(){
  next('sad');
}

function correct(){
  next('happy');
}
</script>

</body>
</html>
